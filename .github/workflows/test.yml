name: Hardhat Test Suite

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

env:
  # Chain Target
  HARDHAT_FORK_TARGET: ${{ secrets.HARDHAT_FORK_TARGET }}

  # Mainnet
  MAINNET_FORKING_BLOCK: ${{ secrets.MAINNET_FORKING_BLOCK }}
  MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
  MAINNET_VERIFY_API_KEY: ${{ secrets.MAINNET_VERIFY_API_KEY }}

  # Arbitrum One
  ARBITRUM_FORKING_BLOCK: ${{ secrets.ARBITRUM_FORKING_BLOCK }}
  ARBITRUM_RPC_URL: ${{ secrets.ARBITRUM_RPC_URL }}
  ARBITRUM_VERIFY_API_KEY: ${{ secrets.ARBITRUM_VERIFY_API_KEY }}

  # Sepolia
  SEPOLIA_FORKING_BLOCK: ${{ secrets.SEPOLIA_FORKING_BLOCK }}
  SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
  SEPOLIA_VERIFY_API_KEY: ${{ secrets.SEPOLIA_VERIFY_API_KEY }}

  # Lisk Sepolia
  LISK_SEPOLIA_FORKING_BLOCK: ${{ secrets.LISK_SEPOLIA_FORKING_BLOCK }}
  LISK_SEPOLIA_RPC_URL: ${{ secrets.LISK_SEPOLIA_RPC_URL }}
  LISK_SEPOLIA_VERIFY_API_KEY: ${{ secrets.LISK_SEPOLIA_VERIFY_API_KEY }}

  # Core DAO
  CORE_DAO_FORKING_BLOCK: ${{ secrets.CORE_DAO_FORKING_BLOCK }}
  CORE_DAO_RPC_URL: ${{ secrets.CORE_DAO_RPC_URL }}
  CORE_DAO_VERIFY_API_KEY: ${{ secrets.CORE_DAO_VERIFY_API_KEY }}

  # Core DAO Testnet
  CORE_DAO_TESTNET_FORKING_BLOCK: ${{ secrets.CORE_DAO_TESTNET_FORKING_BLOCK }}
  CORE_DAO_TESTNET_RPC_URL: ${{ secrets.CORE_DAO_TESTNET_RPC_URL }}
  CORE_DAO_TESTNET_VERIFY_API_KEY: ${{ secrets.CORE_DAO_TESTNET_VERIFY_API_KEY }}

  # Other configs
  REPORT_GAS: ${{ secrets.REPORT_GAS }}
  ETHERUM_PRICE: ${{ secrets.ETHERUM_PRICE }}
  ETHERUM_GAS_PRICE: ${{ secrets.ETHERUM_GAS_PRICE }}
  COINMARKETCAP_API_KEY: ${{ secrets.COINMARKETCAP_API_KEY }}

  # Test accounts - using default hardhat accounts for CI
  DEPLOYER_PK: ${{ secrets.DEPLOYER_PK }}
  EVIDENCE_GUARDIAN_PK: ${{ secrets.EVIDENCE_GUARDIAN_PK }}
  BUYBACK_PK: ${{ secrets.BUYBACK_PK }}
  TREASURY_PK: ${{ secrets.TREASURY_PK }}
  RISK_GUARD_PK: ${{ secrets.RISK_GUARD_PK }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npm run compile

      - name: Run tests
        run: npm run test
